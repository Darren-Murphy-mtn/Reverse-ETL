[project]
name = "github-reverse-etl"
version = "0.1.0"
description = "ELT + reverse-ETL loop over GitHub issues: extract, load to DuckDB, model with dbt, create a ClickUp task per stale issue."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
