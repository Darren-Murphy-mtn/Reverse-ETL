# Single source of truth for the Python side of the pipeline.
# dbt-side thresholds live in dbt_project/dbt_project.yml (vars); tests/test_config_consistency.py
# fails CI if the two drift.

# pytorch/pytorch is omitted. Its quiet-open set is about 13,000 issues, which is the
# wrong volume for a demo write into one ClickUp list.
source_repos:
  - vercel/next.js
  - dbt-labs/dbt-core

# Extracted with the sources so the dbt sandbox threshold still has a repo to attach to.
# The sync does not write to GitHub.
sandbox_repo: Darren-Murphy-mtn/Reverse-ETL-sandbox

# 30 days is the shortest window that still supports the 30-day stale rule. A shorter
# window can only prove "at least N days" with N below the threshold, so the mart is empty.
window_days: 30

paths:
  raw_json: data/raw/json
  raw_parquet: data/raw/parquet
  warehouse: warehouse.duckdb
  sync_logs: logs/reverse_etl

reverse_etl:
  marker: "<!-- reverse-etl:stale-flag -->"
  stale_label: stale
  max_snapshot_age_hours: 24
  write_delay_seconds: 1.0
